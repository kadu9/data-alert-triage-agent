[project]
name = "triage"
version = "0.1.0"
description = "Data alert triage agent"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2",
  "pyyaml",
  "langchain-core",
  "langchain-openai",
  "python-dotenv>=1.2.4",
  "tenacity>=9.2.1",
  "jinja2>=3.1.6",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
testpaths = ["tests"]
